# Drug catalogue. Doses are per dose (mg); "freq" is how often a day.
# ladder = allowed doses in order; target = guideline target (CHECK against the guideline itself).
# tablet_mg = strength of one dispensed tablet, used to write "1 เม็ด", "ครึ่งเม็ด" for patients.
# box_name = the name printed on the packet / pharmacy label the patient holds (shown big on the patient's medicine
#   screen with the tablet strength). Change it to exactly what your pharmacy dispenses, e.g. a brand name.

bisoprolol:
  class: BB
  name_en: Bisoprolol
  name_th: บิโซโพรลอล
  box_name: "Bisoprolol"
  freq: daily
  ladder: [1.25, 2.5, 3.75, 5, 7.5, 10]
  target: 10
  tablet_mg: 5

enalapril:
  class: RASI
  name_en: Enalapril
  name_th: อีนาลาพริล
  box_name: "Enalapril"
  freq: bid
  ladder: [2.5, 5, 10, 20]
  target: 20
  tablet_mg: 5

sacubitril_valsartan:
  class: ARNI
  name_en: Sacubitril/valsartan
  name_th: ซาคูบิทริล/วาลซาร์แทน
  box_name: "Sacubitril/Valsartan"
  freq: bid
  ladder: [50, 100, 200]
  target: 200
  tablet_mg: per_dose                  # one tablet of the matching strength each time
  labels: {50: "24/26 mg", 100: "49/51 mg", 200: "97/103 mg"}

spironolactone:
  class: MRA
  name_en: Spironolactone
  name_th: สไปโรโนแลกโตน
  box_name: "Spironolactone"
  freq: daily
  ladder: [12.5, 25, 50]
  target: 50
  tablet_mg: 25

empagliflozin:
  class: SGLT2I
  name_en: Empagliflozin
  name_th: เอ็มพากลิโฟลซิน
  box_name: "Empagliflozin"
  freq: daily
  ladder: [10]
  target: 10
  tablet_mg: 10

dapagliflozin:
  class: SGLT2I
  name_en: Dapagliflozin
  name_th: ดาพากลิโฟลซิน
  box_name: "Dapagliflozin"
  freq: daily
  ladder: [10]
  target: 10
  tablet_mg: 10

furosemide:
  class: DIURETIC                      # not titrated by Dose-D
  name_en: Furosemide
  name_th: ฟูโรซีไมด์
  box_name: "Furosemide"
  freq: daily
  ladder: []
  target: null
  tablet_mg: 40

classes:
  BB: Beta-blocker
  RASI: ACE inhibitor / ARB
  ARNI: ARNI
  MRA: MRA
  SGLT2I: SGLT2 inhibitor
  DIURETIC: Diuretic
