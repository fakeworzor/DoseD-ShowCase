# rules.yaml texts
Average systolic BP below 95: "ความดันตัวบนเฉลี่ยต่ำกว่า 95"
Dizziness with average systolic BP below 100: "เวียนหัว ร่วมกับความดันตัวบนเฉลี่ยต่ำกว่า 100"
Potassium above 5.0: "โพแทสเซียมสูงกว่า 5.0"
Creatinine up more than 30% from baseline: "ครีเอตินินสูงขึ้นเกิน 30% จากค่าเดิม"
NSAID mentioned (raises potassium and kidney risk): "มีการพูดถึงยา NSAID (เพิ่มความเสี่ยงโพแทสเซียมและไต)"
Average heart rate below 60: "ชีพจรเฉลี่ยต่ำกว่า 60"
Weight up more than 2 kg in 3 days (possible fluid build-up): "น้ำหนักขึ้นเกิน 2 กก. ใน 3 วัน (อาจมีน้ำคั่ง)"
Potassium has risen 3 results in a row: "โพแทสเซียมสูงขึ้น 3 ครั้งติดกัน"
When systolic BP is under 110, step the MRA first (it lowers BP the least): "ถ้าความดันตัวบนต่ำกว่า 110 ให้ปรับ MRA ก่อน (ลดความดันน้อยที่สุด)"
Default order: "ลำดับปกติ"
Add an SGLT2 inhibitor (4th pillar) when eGFR is at least 20: "เพิ่ม SGLT2 inhibitor (ยากลุ่มที่ 4) เมื่อ eGFR อย่างน้อย 20"
Add an MRA when K+ is 5.0 or less and eGFR at least 30: "เพิ่ม MRA เมื่อ K+ ไม่เกิน 5.0 และ eGFR อย่างน้อย 30"
Replace the ACE inhibitor with sacubitril/valsartan when still symptomatic at target ACE inhibitor dose: "เปลี่ยน ACE inhibitor เป็น sacubitril/valsartan เมื่อยังมีอาการทั้งที่ได้ ACE inhibitor ถึงขนาดเป้าหมาย"
Stop the ACE inhibitor 36 hours before the first dose.: "หยุด ACE inhibitor 36 ชั่วโมงก่อนเริ่มยาโดสแรก"
Beta-blocker step when heart rate is at least 60 and systolic BP at least 100: "ปรับ beta-blocker เมื่อชีพจรอย่างน้อย 60 และความดันตัวบนอย่างน้อย 100"
ACE inhibitor step needs systolic BP of at least 110 and K+ of 5.0 or less: "ปรับ ACE inhibitor ต้องมีความดันตัวบนอย่างน้อย 110 และ K+ ไม่เกิน 5.0"
ARNI step needs systolic BP of at least 110 and K+ of 5.0 or less: "ปรับ ARNI ต้องมีความดันตัวบนอย่างน้อย 110 และ K+ ไม่เกิน 5.0"
MRA step needs K+ of 5.0 or less and eGFR of at least 30: "ปรับ MRA ต้องมี K+ ไม่เกิน 5.0 และ eGFR อย่างน้อย 30"

